name: Generate Offener Anfang PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate_offener_anfang.py'
      - 'tools/run_offener_anfang_german.py'
      - '.github/workflows/generate-offener-anfang.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install reportlab pypdf
      - name: Generate PDF
        run: python tools/run_offener_anfang_german.py
      - name: Verify PDF
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='materialien/offener-anfang/Offener_Anfang_Wunschbriefe_Druckpaket.pdf'
          r=PdfReader(p)
          assert len(r.pages) == 16, len(r.pages)
          for i,page in enumerate(r.pages,1):
              w=float(page.mediabox.width); h=float(page.mediabox.height)
              assert 590 < w < 600 and 840 < h < 850, (i,w,h)
          text='\n'.join((page.extract_text() or '') for page in r.pages)
          for word in ['wählen','wünsche','könnten','Grüße','zusätzliche']:
              assert word in text, word
          print('verified', len(r.pages), 'A4 pages with German orthography')
          PY
      - name: Commit generated PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add materialien/offener-anfang/Offener_Anfang_Wunschbriefe_Druckpaket.pdf
          if git diff --cached --quiet; then
            echo 'No PDF changes.'
          else
            git commit -m 'Generate open-beginning material PDF'
            git push
          fi
